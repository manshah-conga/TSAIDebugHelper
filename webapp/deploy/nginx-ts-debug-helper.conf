# nginx reverse proxy: terminates TLS on 443 and forwards to the app on
# 127.0.0.1:8000. See deploy/README.md for how to get the certificate for a
# bare IP address (no domain needed).
#
#   sudo cp nginx-ts-debug-helper.conf /etc/nginx/sites-available/ts-debug-helper
#   sudo ln -s /etc/nginx/sites-available/ts-debug-helper /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name 44.226.216.180;

    # Let's Encrypt HTTP-01 validation lands here. It must stay reachable on
    # port 80 from the public internet or renewal fails -- and with 160-hour
    # certificates, a renewal failure becomes an outage within days.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name 44.226.216.180;

    ssl_certificate     /etc/letsencrypt/live/44.226.216.180/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/44.226.216.180/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Debug logs and knowledgebase payloads are large; the default 1m rejects
    # a decent-sized log upload with a 413.
    client_max_body_size 32m;

    # --- MCP endpoint ---
    # Streamable HTTP holds a response open and streams JSON-RPC over it, so
    # buffering must be off or the client sees nothing until the call ends,
    # and the read timeout must outlive the slowest tool. An org connect or
    # refresh is the slow one -- it fetches the whole org from Salesforce.
    location /mcp {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Keep tokens out of the access log when a client can only pass one in
        # the query string. Pair this with TS_MCP_ALLOW_QUERY_TOKEN=0 once no
        # client needs it.
        access_log /var/log/nginx/mcp.log combined;
    }

    # --- web UI + REST API ---
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
